name: nexpill
description: "A medication timing tracker for caregivers. Your data stays on your phone."
publish_to: 'none'

# NAME+CODE, and the only place the version lives. CODE is derived from NAME
# (major*10000 + minor*100 + patch). Change it with tool/bump_version.sh, not
# by hand. See docs/RELEASING.md.
version: 0.1.0+100

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  intl: ^0.20.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/brand/nexpill_logo_512.png

  # Bundled, never fetched: Nexpill has no network. Both SIL OFL 1.1; the
  # licence texts ship alongside in assets/fonts/.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
