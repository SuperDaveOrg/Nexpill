# Deliberately quiet: one grouped pull request a month per ecosystem, minor
# and patch updates only. Major versions and the Flutter SDK itself are
# upgraded by hand, on purpose (docs/RELEASING.md, "Keeping up to date").
# CI checks each pull request — including that no permission crept in.

version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      pub:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
